services:
  db:
    image: postgres:16-alpine
    container_name: wm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-werkstatt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-werkstatt}
      POSTGRES_DB: ${POSTGRES_DB:-werkstatt}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-werkstatt}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: wm-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web-UI

  backup:
    image: postgres:16-alpine
    container_name: wm-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-werkstatt}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U ${POSTGRES_USER:-werkstatt} ${POSTGRES_DB:-werkstatt}
        | gzip > /backups/werkstatt_$$(date +%Y%m%d_%H%M%S).sql.gz;
        find /backups -name "*.sql.gz" -mtime +30 -delete;
        sleep 86400;
      done'

volumes:
  db_data:
