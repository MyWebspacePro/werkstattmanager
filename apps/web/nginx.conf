# TLS endet bei Traefik, nicht in diesem Container. Darum darf nginx das
# hereingereichte X-Forwarded-Proto nicht mit $scheme (= "http") ueberschreiben,
# sonst haelt die API sich fuer unverschluesselt. Fallback nur, wenn der Header fehlt.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Statisches React-Frontend
    root /usr/share/nginx/html;
    index index.html;

    # --- Sicherheits-Header (gelten für SPA und /api/*, da beides hier durchläuft) ---
    # Achtung: add_header im server-Block, nicht in einem location — sonst
    # überschreiben die location-Blöcke die hier gesetzten Header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS bewusst OHNE includeSubDomains: aiconso.eu trägt weitere Subdomains,
    # die so nicht zwangsweise auf HTTPS gezwungen werden.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP zunächst nur im Report-Only-Modus: erst die Browser-Konsole prüfen,
    # dann auf "Content-Security-Policy" umstellen (siehe README im Repo).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API an das Backend weiterreichen (Container-Netzwerk)
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 20m;
    }

    # PDFs/Uploads später ebenfalls ans Backend
    location /uploads/ {
        proxy_pass http://api:3001;
        client_max_body_size 20m;
    }

    # SPA-Fallback: alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
